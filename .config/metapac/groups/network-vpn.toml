# metapac group: network-vpn — networking stack, VPNs, remote access, mail utils
# Membership source: docs/package-inventory.md; adopted in Story 2.8. D3: all VPNs kept.
# GlobalProtect + openconnect live in the work group (D2).
# Story 3.9 chose repo networkmanager; its required wpa_supplicant dependency is the sole Wi-Fi backend.
# gnu-netcat + netmask: build-rot relics (200x-era, fail modern toolchains) —
# machine-local on the workstation; subnetcalc (declared) and repo openbsd-netcat
# are the modern equivalents (2.7 VM finding).
# Time sync is systemd-timesyncd on every class (install-on-metal and the
# archinstall seeds enable it). ntp + networkmanager-dispatcher-ntpd were
# dropped 2026-10-20: the dispatcher started ntpd on every connection, where it
# segfaulted on glibc 2.44 and left the portable drive's boot degraded.
[arch]
packages = [
  "b43-fwcutter",
  "bind",
  "dhcpcd",
  "dnsmasq",
  "filezilla",
  "freerdp",
  "gss-ntlmssp",
  "inetutils",
  "ipcalc",
  "iproute2",
  "ipset",
  "iputils",
  "ipv6calc",
  "modemmanager",
  "net-tools",
  "netctl",
  "networkmanager",
  "networkmanager-openvpn",
  "nmap",
  "nss-mdns",
  "openbsd-netcat",  # gnu-netcat's replacement (2.15 removal validation, 2026-07-07)
  "openssh",
  "openvpn",
  "openvpn-update-systemd-resolved",
  "putty",
  "remmina",
  "rsync",
  "s-nail",
  "samba",
  "siege",
  "smtp-cli",
  "sshuttle",
  "ssmtp",
  "subnetcalc",
  "systemd-resolvconf",
  "tailscale",
  "traceroute",
  "udp2raw",
  "usb_modeswitch",
  "vpn-slice",
  "whois",
  "wireguard-tools",
  "wireshark-qt",
]
