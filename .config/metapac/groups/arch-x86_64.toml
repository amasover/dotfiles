# metapac architecture adapter: x86_64 machines. config.toml##template renders
# "arch-{{ yadm.arch }}" into every class, so this file holds the packages the
# shared purpose groups would carry if they did not have to install on aarch64:
# chaotic-aur and multilib (lib32-*) exist only for x86_64, and the AUR/repo
# packages below ship prebuilt x86_64 binaries (or hardcode an x86_64 build
# target). AUR source builds whose arch=() merely omits aarch64 stay shared:
# aarch64 builds them with makepkg --ignorearch. Each line names its purpose
# group; arch-aarch64.toml holds the substitutes where aarch64 has one.
[arch]
packages = [
  "1password",  # security
  # base: chaotic-aur infrastructure. bootstrap's enable step (2.28) installs
  # these; declared so the unmanaged check stays exactly empty (2.35). Until
  # the host adopts chaotic they drift as declared-but-missing.
  "chaotic-keyring",
  "chaotic-mirrorlist",
  "changie",  # development: its PKGBUILD rejects any CARCH but x86_64
  "discord",  # comms
  "feishin-bin",  # media
  "git-credential-manager-bin",  # development: .gitconfig's credential helper
  "lib32-glu",  # desktop
  "omnisharp-roslyn-bin",  # editor: .spacemacs lsp-csharp server
  "sedutil",  # security: its autotools build fails on aarch64, and its PBA image is x86 (linuxpba)
  "teensy-loader",  # optional
  "tidal-hifi-bin",  # media
  "zoom",  # comms
]
