# metapac group: media — audio/video/image tools, document viewers, screen recording
# Membership source: docs/package-inventory.md; adopted in Story 2.8.
# Screen recorders: `gpu-screen-recorder` + `gpu-screen-recorder-ui` are the keepers
# (Story 3.10, 2026-08-12) — actively maintained, X11 *and* Wayland, VAAPI h264/hevc/vp9.
#   kooha dropped — it needs the ScreenCast xdg-desktop portal, which no backend implements
#   under i3/X11; revisit if the desktop moves to Wayland. See
#   knowledge/errors/screencast-portal-missing-on-i3-x11.md.
#   simplescreenrecorder dropped — Arch removed it from the repos, so the installed 0.4.4-4
#   is an orphan still linked against ffmpeg 7 (libavcodec.so.61 vs the current .so.63) and
#   cannot start at all. Upstream's last release is 2020; not worth an AUR rebuild.
#   kazam dropped — dead upstream (0.4.0, 2020-era), superseded.
#   byzanz removed 2026-07-04 (dead upstream — AUR-deleted; 2.7 VM validation finding).
# Provider pins (Story 2.26 — unattended --noconfirm picks option 1 otherwise):
#   tesseract-data-eng pins tesseract's `tessdata` (default was Afrikaans);
#   xdg-desktop-portal-gtk pins `xdg-desktop-portal-impl` for gtk4/lutris (default was
#   cosmic; the pin predates kooha's removal and is still needed without it);
#   pipewire-jack pins `jack` for ffmpeg/mpv/qemu-audio-jack etc. (default was jack2 —
#   wrong on a pipewire host; conflicts jack2, so adopting on a jack2 machine means
#   approving the jack2 removal prompt once — seen 2026-07-10 VM run).
[arch]
packages = [
  "alsa-utils",
  "cli-visualizer",
  "feishin-bin",
  "ffmpegthumbnailer",
  "gimp",
  "gpu-screen-recorder",
  "gpu-screen-recorder-ui",
  "guvcview",
  "imagemagick",
  "jfbview",
  "mpv",
  "pamixer",
  "pavucontrol",
  "perl-image-exiftool",
  "pipewire-jack",
  "pipewire-pulse",
  "playerctl",
  "tesseract",
  "tesseract-data-eng",
  "tidal-hifi-bin",
  "vlc",
  "xdg-desktop-portal-gtk",
  "yt-dlp",
  "zathura",
  "zathura-ps",
]
