# metapac group: editor — editors and editor tooling
# Membership source: docs/package-inventory.md; adopted in Story 2.8.
[arch]
packages = [
  "autopep8",
  "bash-language-server",
  "editorconfig-core-c",
  "emacs",
  "ex-vi-compat",
  "glow",
  "gvim",
  "intellij-idea-oss",  # Arch's rename of intellij-idea-community-edition (2026)
  "lua-language-server",
  "marksman",
  "nano",
  "neovim",
  "npm",  # installs the pinned Emacs Copilot language server during bootstrap
  "powershell-editor-services-bin",  # arch-neutral .NET zip; builds anywhere with --ignorearch
  "pyright",  # system server used by .spacemacs lsp-pyright
  "ruff",
  "typescript-language-server",
  "vim-airline",
  "vim-gitgutter",
  "vim-go",
  "vim-language-server",
  "vim-plug",
  "visual-studio-code-bin",
  "yaml-language-server",
]
