# metapac hardware adapter: current Intel laptop only (Story 2.30, #96).
# Xorg uses its built-in modesetting DDX; no xf86-video-* fallback belongs here.
[arch]
packages = [
  "acpi",
  "acpid",
  "intel-media-driver",
  "intel-ucode",
  "lib32-vulkan-intel",
  "refind",
  "refind-theme-nord",
  # oneVPL GPU runtime (Tiger Lake+). Without it the libvpl dispatcher falls back
  # to legacy Intel Media SDK (API 1.35), which fails on Raptor Lake and breaks
  # QuickSync encoding in OBS (MFX_ERR_DEVICE_FAILED).
  "vpl-gpu-rt",
  "vulkan-intel",
]
