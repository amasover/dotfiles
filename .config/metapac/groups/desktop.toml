# metapac group: desktop — Xorg/i3 session, fonts, themes, and session utilities
# Membership source: docs/package-inventory.md; adopted in Story 2.8.
# polybar-wireguard-git is the machine's only polybar (provides "polybar") — declare the
# real name, not the alias (knowledge/reference/pacman-provides-and-binary-ownership.md).
# Aaron uses its indicator to show VPN connectivity in the bottom bar, and may reuse it
# on other machines for VPN status — it stays in desktop (not work) because it is also
# the bar itself.
# bluez/bluez-utils/bluetui: post-inventory arrivals, placed here as session hardware (2.8 call).
# colorpicker: build-rot relic (2017 GTK, no longer compiles) — machine-local on the
# workstation; gpick (declared here) is the live alternative (2.7 VM finding).
# GPU, firmware, and boot packages live in concrete hardware adapters (Story 2.30).
# The Intel laptop and both guest hypervisors use Xorg's built-in or dedicated
# driver; no generic xf86-video fallback belongs in this shared group.
[arch]
packages = [
  "adobe-source-code-pro-fonts",
  "alacritty",
  "arandr",
  "arc-gtk-theme",
  "arc-solid-gtk-theme",
  "autorandr",
  "awesome-terminal-fonts",
  "bluetui",
  "bluez",
  "bluez-utils",
  "clight",
  "clight-gui-git",
  "conky",
  "libglvnd",  # provider pin (bootstrap 3d): chaotic's nvidia-340xx-utils also provides libgl and the resolver prompt kills unattended syncs (2026-08-16)
  "dunst",
  "feh",
  "flashfocus",
  "gpick",
  "hardcode-tray",
  "i3-wm",
  "i3lock",
  "ibus-chewing",
  "kwallet5",
  "lib32-glu",
  "lightdm-webkit-theme-litarvan",
  "lxappearance",
  "lxqt-policykit",
  "network-manager-applet",
  "noto-fonts",
  "noto-fonts-emoji",
  "noto-fonts-sc",
  "noto-fonts-tc",
  "opendesktop-fonts",
  "papirus-icon-theme",
  "parcellite",
  "perl-anyevent-i3",
  "polybar-wireguard-git",
  "redshift",
  "rofi",
  "scrot",
  "siji-git",
  "systemd-lock-handler",
  "terminus-font",
  "thunar",
  # "Hack" is named by i3 config, rofi, dunst, and .spacemacs; until 2026-08-22
  # it was satisfied only by an untracked ~/.local/share/fonts copy (#166).
  # NOTE: the polybar themes' "Source Code Pro for Powerline" (font-0) is NOT
  # declared here — no repo package ships the patched families (extra's
  # powerline-fonts is only PowerlineSymbols.otf); it comes from the vendored
  # PKGBUILD otf-source-code-pro-powerline (Story 2.47, tools/custom-pkgs).
  "ttf-hack",
  "ttf-liberation",
  "ttf-nerd-fonts-symbols",
  "ttf-nerd-fonts-symbols-common",
  "ttf-nerd-fonts-symbols-mono",
  "tumbler",
  "xbindkeys",
  "xclip",
  "xidlehook",
  "xorg-appres",
  "xorg-server",
  "xorg-server-xephyr",
  "xorg-xev",
  "xorg-xfd",
  "xorg-xinit",
  "xorg-xkill",
]
