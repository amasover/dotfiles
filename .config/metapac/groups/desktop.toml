# metapac group: desktop — Xorg/i3 session, GPU, fonts, themes, session utilities
# Membership source: docs/package-inventory.md; adopted in Story 2.8.
# polybar-wireguard-git is the machine's only polybar (provides "polybar") — declare the
# real name, not the alias (knowledge/reference/pacman-provides-and-binary-ownership.md).
# Aaron uses its indicator to show VPN connectivity in the bottom bar, and may reuse it
# on other machines for VPN status — it stays in desktop (not work) because it is also
# the bar itself.
# bluez/bluez-utils/bluetui: post-inventory arrivals, placed here as session hardware (2.8 call).
# colorpicker: build-rot relic (2017 GTK, no longer compiles) — machine-local on the
# workstation; gpick (declared here) is the live alternative (2.7 VM finding).
# xf86-video-intel removed 2026-08-12 (Story 3.16) — the legacy DDX does not recognise this
# Raptor Lake chipset and disabled Xorg acceleration outright ("Unknown chipset" / "Failed to
# submit rendering commands"). Xorg's built-in modesetting driver is correct for Gen4+ Intel;
# do not re-add. The remaining xf86-video-amdgpu / xf86-video-vesa / vulkan-radeon entries are
# from an earlier AMD machine and are Story 2.30's (#96) hardware-split problem, not fixed here.
[arch]
packages = [
  "adobe-source-code-pro-fonts",
  "alacritty",
  "arandr",
  "arc-gtk-theme",
  "arc-solid-gtk-theme",
  "autorandr",
  "awesome-terminal-fonts",
  "bluetui",
  "bluez",
  "bluez-utils",
  "clight",
  "clight-gui-git",
  "conky",
  "libglvnd",  # provider pin (bootstrap 3d): chaotic's nvidia-340xx-utils also provides libgl and the resolver prompt kills unattended syncs (2026-08-16)
  "dunst",
  "feh",
  "flashfocus",
  "gpick",
  "hardcode-tray",
  "i3-wm",
  "i3lock",
  "ibus-chewing",
  "kwallet5",
  "lib32-glu",
  "lib32-vulkan-radeon",
  "lightdm-webkit-theme-litarvan",
  "lxappearance",
  "lxqt-policykit",
  "network-manager-applet",
  "noto-fonts",
  "noto-fonts-emoji",
  "noto-fonts-sc",
  "noto-fonts-tc",
  "opendesktop-fonts",
  "papirus-icon-theme",
  "parcellite",
  "perl-anyevent-i3",
  "polybar-wireguard-git",
  # polybar themes declare "Source Code Pro for Powerline" (font-0); today it
  # only exists as an untracked ~/.local/share/fonts copy — this makes fresh
  # machines get the family from the repo package (#166)
  "powerline-fonts",
  "redshift",
  "rofi",
  "scrot",
  "siji-git",
  "systemd-lock-handler",
  "terminus-font",
  "thunar",
  "ttf-liberation",
  "ttf-nerd-fonts-symbols",
  "ttf-nerd-fonts-symbols-common",
  "ttf-nerd-fonts-symbols-mono",
  "tumbler",
  "vulkan-radeon",
  "xautolock",
  "xbindkeys",
  "xclip",
  "xf86-video-amdgpu",
  "xf86-video-vesa",
  "xidlehook",
  "xorg-appres",
  "xorg-server",
  "xorg-server-xephyr",
  "xorg-xev",
  "xorg-xfd",
  "xorg-xinit",
  "xorg-xkill",
]
