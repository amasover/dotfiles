# metapac group: security — secrets, scanning, drive security
# Membership source: docs/package-inventory.md; adopted in Story 2.8.
# kwallet5 (desktop) and keychain (shell-cli) are declared in their primary groups.
# sedutil: keep-for-now (inventory open item). 1password ships x86_64 binaries
# only and lives in arch-x86_64.
[arch]
packages = [
  "1password-cli",
  "gitleaks",
  "pwgen",
  "sedutil",
]
