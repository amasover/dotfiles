; nord-arrow-slim (#174) — nord-arrow's exact bars with the slim Source Code
; Pro for Powerline arrows/text (the #167 rendering). Everything except the
; font pick is shared: same body, and ./bars is a symlink to nord-arrow's.
; The base-* include picks the font variant — include exactly one.
include-file = $HOME/.config/polybar/themes/global/base-slim
include-file = $HOME/.config/polybar/themes/global/modules
include-file = $HOME/.config/polybar/themes/nord-arrow/body
