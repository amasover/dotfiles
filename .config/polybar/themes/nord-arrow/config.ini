; nord-arrow — big-arrow variant (the default theme). Entry file only: the
; bars/colors/modules live once in ./body, shared with nord-arrow-slim
; (#174); the base-* include picks the font variant ([bar/global] comes
; complete from it — include exactly one).
include-file = $HOME/.config/polybar/themes/global/base-big
include-file = $HOME/.config/polybar/themes/global/modules
include-file = $HOME/.config/polybar/themes/nord-arrow/body
