# reflector policy - the single definition of how mirrors get ranked.
# Installed to /etc/xdg/reflector/reflector.conf by bootstrap step 3b; read by
# reflector.timer (weekly), by bootstrap's stale-list re-rank, and by the
# update_pacman_mirrorlist shell helper. One file, so all three agree.
#
# Arch ships --latest 5 --sort age with no country filter: the five most
# recently *synced* mirrors on earth. On 2026-08-26 that was Brazil x2,
# Frankfurt, Johannesburg and Umea for a Mountain-time laptop - pacman pulled
# at ~1.2 MiB/s while US mirrors measured 8-10 MiB/s on the same link. Age says
# nothing about distance, so rank by measured rate inside the country instead.
# Rating downloads from each candidate, so bound that work to five mirrors.
--save /etc/pacman.d/mirrorlist
--protocol https
--country US
--age 6
--latest 5
--fastest 5
--sort rate
