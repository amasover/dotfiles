# Initramfs boot chain for every machine this repository provisions (Story 2.59, #258).
# Bootstrap symlinks this file to /etc/mkinitcpio.conf.d/10-dotfiles-hooks.conf;
# install-on-metal copies it into a fresh target before the first image is built.
# mkinitcpio sources drop-ins after /etc/mkinitcpio.conf, so this array wins and
# pacman keeps owning the base file. MODULES stays machine-local, never here.
#
# systemd initramfs: sd-encrypt unlocks from rd.luks.name=, and systemd resumes
# from resume= without a hook. base precedes systemd so emergency mode keeps a
# rescue shell, which also needs SYSTEMD_SULOGIN_FORCE=1 on the command line
# because the root account is locked.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt lvm2 filesystems fsck)
