# Portable installs only (Story 2.57, #254). install-on-metal copies this to
# /etc/mkinitcpio.conf.d/90-dotfiles-portable.conf, sourced after the tracked
# HOOKS policy. It drops autodetect, so every image carries the storage, USB and
# keyboard drivers of machines the drive has never seen, and the LUKS passphrase
# can be typed on any of them.
_dotfiles_hooks=()
for _dotfiles_hook in "${HOOKS[@]}"; do
    [[ $_dotfiles_hook == autodetect ]] || _dotfiles_hooks+=("$_dotfiles_hook")
done
HOOKS=("${_dotfiles_hooks[@]}")
unset _dotfiles_hook _dotfiles_hooks
