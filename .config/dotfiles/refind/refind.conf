# Managed by dotfiles refind-config (Story 2.52, #230).
# Portable policy only. refind-config generates dotfiles-machine.conf and
# /boot/refind_linux.conf from live or explicit machine-local state.

timeout 20
use_nvram false

# Keep removable media and Ubuntu's loader discoverable. Firmware entries stay
# outside this file; refind-config never edits NVRAM.
scanfor internal,external,optical,manual

# Arch kernels use names such as vmlinuz-linux rather than versioned filenames.
scan_all_linux_kernels true
fold_linux_kernels true
extra_kernel_version_strings "linux-hardened,linux-rt-lts,linux-zen,linux-lts,linux-rt,linux"
default_selection "vmlinuz-linux"

# Generated scan path first, package-owned Nord theme, then appearance
# overrides on top of it (rEFInd keeps the last value of a repeated token).
include dotfiles-machine.conf
include themes/nord/theme.conf

# Nord chrome with stock rEFInd OS logos: refind-config leaves Nord's os_*.png
# out of the managed theme copy, so rEFInd falls back to EFI/refind/icons.
# Utilities row, ordered: shell, about, shutdown, reboot, firmware setup.
# rEFInd 0.14.2 does not clear the default tool list when a shorter showtools
# line is parsed, so defaults left in later slots double-render about,
# shutdown, reboot, and firmware. Listing twelve entries overwrites every
# default slot on 0.14.2 and stays correct once the reset lands upstream; the
# seven padding entries render only when their tool file exists, so machines
# that carry memtest, gdisk, or a MOK utility gain launchers, not clutter.
showtools shell,about,shutdown,reboot,firmware,memtest,gdisk,gptsync,apple_recovery,windows_recovery,netboot,mok_tool
