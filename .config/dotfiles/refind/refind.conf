# Managed by dotfiles refind-config (Story 2.52, #230).
# Portable policy only. refind-config generates dotfiles-machine.conf and
# /boot/refind_linux.conf from live or explicit machine-local state.

timeout 20
use_nvram false

# Keep removable media and Ubuntu's loader discoverable. Firmware entries stay
# outside this file; refind-config never edits NVRAM.
scanfor internal,external,optical,manual

# Arch kernels use names such as vmlinuz-linux rather than versioned filenames.
scan_all_linux_kernels true
fold_linux_kernels true
extra_kernel_version_strings "linux-hardened,linux-rt-lts,linux-zen,linux-lts,linux-rt,linux"
default_selection "vmlinuz-linux"

# Generated scan path first, package-owned Nord theme last.
include dotfiles-machine.conf
include themes/nord/theme.conf
