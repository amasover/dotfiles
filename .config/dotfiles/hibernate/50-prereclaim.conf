# Local workaround for loaded hibernation stalling in image preallocation on
# Linux 7.2.3-arch1-3. Evicts the working set to swap while userspace is still
# running, so the frozen phase has little left to shrink. Zswap stays enabled
# for normal use. Remove after an upstream-fixed kernel passes a loaded
# hibernate/resume without it. See README.md in this directory.
#
# The unit sets TimeoutStartUSec=infinity, so the bounded eviction below cannot
# trip a start timeout. ExecStartPre is prefixed with "-" on purpose: this is a
# speed workaround, never a precondition for hibernating. If the helper fails,
# the machine must still hibernate rather than stay awake on a closed lid.
[Service]
RuntimeDirectory=hibernate-prereclaim
RuntimeDirectoryMode=0700
ExecStartPre=-/usr/local/libexec/hibernate-prereclaim prepare
ExecStopPost=/usr/local/libexec/hibernate-prereclaim restore
UnsetEnvironment=HIBERNATE_PRERECLAIM_ROOT HIBERNATE_PRERECLAIM_DEADLINE
