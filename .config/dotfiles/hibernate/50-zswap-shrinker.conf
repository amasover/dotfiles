# Local workaround for loaded hibernation hangs on Linux 7.2.3-arch1-3.
# Keep zswap and its proactive shrinker enabled during normal use.
# Remove after an upstream-fixed kernel passes loaded hibernate/resume with
# shrinker_enabled=Y throughout. See README.md in this directory.
[Service]
RuntimeDirectory=hibernate-zswap-shrinker
RuntimeDirectoryMode=0700
ExecStartPre=/usr/local/libexec/hibernate-zswap-shrinker prepare
ExecStopPost=/usr/local/libexec/hibernate-zswap-shrinker restore
UnsetEnvironment=HIBERNATE_ZSWAP_ROOT
