# open-vm-tools configuration, linked to /etc/vmware-tools/tools.conf by
# bootstrap step 6a2 on VMware guests that have no vmware X driver (the
# aarch64 Arch Ports work-vm: xf86-video-vmware does not exist there).
#
# Without the X driver only the kernel path can apply the host's display
# layout. resolutionKMS is that path, and open-vm-tools leaves it off unless
# this file enables it; the X-side resolutionSet plugin then holds the
# resize capability and drops every layout (full screen never resized, seen
# live on Fusion 26H1, 2026-11-02). With it on, the user agent logs "Backing
# off for resolutionKMS" and vmwgfx receives the topology.
[resolutionKMS]
enable=true
