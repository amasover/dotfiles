symbolPreset: nerd
composer:
  shape: box
theme:
  dark: dark-nord
setupVersion: 2
providers:
  webSearchOrder:
    []
modelRoleStorage: project
modelRoles:
  default: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-opus-5-5:medium
  smol: anthropic/claude-haiku-4-5:low
  slow: anthropic/claude-opus-5-5:medium
task:
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    reviewer: "@slow"
dev:
  autoqaConsent: granted
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 3600
  idleThresholdTokens: 100000
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
