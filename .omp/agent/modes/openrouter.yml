# OpenRouter mode: retain GLM for primary work; keep delegated work inexpensive.
# MiniMax handles general tasks; DeepSeek Pro reviews; Flash handles lookup.
modelRoles:
  default: openrouter/z-ai/glm-5.3:max
  task: openrouter/minimax/minimax-m3:medium
  slow: openrouter/deepseek/deepseek-v4-pro-0813:high
  smol: openrouter/deepseek/deepseek-v4-flash-0731:low
task:
  agentModelOverrides:
    task: "@task"
    reviewer: "@slow"
    scout: "@smol"
    sonic: "@smol"
