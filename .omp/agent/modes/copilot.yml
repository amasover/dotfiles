# GitHub Copilot subscription mode: Sol handles primary work and reviews.
# Luna handles general tasks at max, mechanical verification and read-only
# lookup at xhigh. Sol max is its DeepSWE v1.1 peak (73%); generic tasks pin to
# Luna max (67%) so they stay on the Copilot subscription instead of inheriting
# the global Anthropic worker.
modelRoles:
  default: github-copilot/caude-opus-5.5:xhigh
  task: github-copilot/gpt-6-luna:max
  smol: github-copilot/gpt-6-luna:xhigh
  slow: github-copilot/gpt-6.1-sol:high
task:
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    reviewer: "@slow"
